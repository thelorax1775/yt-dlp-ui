name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Build
        run: npm run build
      - name: Smoke test (next start, /api rewrite, image endpoint off)
        run: npm run test:smoke

  frontend-image:
    name: frontend-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --build-arg BACKEND_URL=http://127.0.0.1:9 -t ytdlp-frontend:ci frontend
      - name: Runs on Node 22 as an unprivileged user
        run: |
          test "$(docker run --rm ytdlp-frontend:ci id -un)" = node
          docker run --rm ytdlp-frontend:ci node --version | grep -q '^v22\.'
      - name: Serves pages and keeps the image endpoint off
        run: |
          docker run -d --name fe -p 3000:3000 ytdlp-frontend:ci
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://127.0.0.1:3000/
          code=$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:3000/_next/image?url=https%3A%2F%2Fexample.com%2F&w=64&q=75')
          echo "image endpoint: $code"
          test "$code" = 404 -o "$code" = 400
      - name: Container logs
        if: always()
        run: docker logs fe || true
